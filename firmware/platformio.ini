; Firmware ESP32 cho giàn phơi thông minh. Xem README.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; 6.9.0 = Arduino-ESP32 core 2.0.17. Các sketch của kit dùng API 2.x, nên ghim phiên bản.
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Chỉ bật cảnh báo cho code của mình (src/), không làm ồn log của thư viện bên thứ ba.
build_src_flags = -Wall -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; Demo/quay video: thời gian xác nhận mưa/khô rút ngắn (xem include/config.h).
[env:esp32dev-demo]
extends = env:esp32dev
build_flags = -DDEMO_FAST_TIMERS=1

; Unit test trên máy tính: pio test -e native
; Chỉ biên dịch lib/awning_core và lib/awning_msg; src/main.cpp cần Arduino nên bị loại.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++11 -Wall -Wextra -Wpedantic
lib_deps = bblanchon/ArduinoJson@^7.2.0
