# Chạy: cd deploy && ./mosquitto/gen-passwd.sh && cp ../backend/.env.example ../backend/.env && docker compose up -d --build
# Mosquitto: broker MQTT trong LAN. backend: API + giao diện web (http://<IP máy>:8080).
services:
  mosquitto:
    # Ghim phiên bản đã kiểm chứng đầy đủ (2.0.18). Thẻ "2" hiện trỏ tới 2.1.x: bản đó vẫn nạp được file mật khẩu và ACL ở đây
    # (chỉ cảnh báo về quyền file, "future versions will refuse") nhưng chưa được kiểm thử như 2.0.18. Nâng cấp là một việc có chủ ý.
    image: eclipse-mosquitto:2.0.18
    container_name: awning-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      # Tạo bằng ./mosquitto/gen-passwd.sh (đã .gitignore)
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: awning-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    # Bí mật và cấu hình (MQTT_USER, MQTT_PASSWORD khớp gen-passwd.sh, toạ độ, API_TOKEN...) nằm trong backend/.env
    env_file:
      - ../backend/.env
    environment:
      # Trong mạng của compose, broker có tên dịch vụ là "mosquitto" (ghi đè giá trị trong .env)
      MQTT_URL: tcp://mosquitto:1883
      DB_PATH: /data/awning.db
      STATIC_DIR: /app/frontend
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

volumes:
  mosquitto-data:
  backend-data:

# Cố định mạng riêng của compose thay vì để Docker tự chọn một dải 172.x.0.0/16. Dải tự chọn có thể TRÙNG mạng WiFi
# đang dùng (hotspot iPhone luôn là 172.20.10.0/28, nằm trong 172.20.0.0/16). Khi đó container coi mọi máy trong dải
# ấy là "ở cùng mạng bridge", không gửi trả lời qua máy chủ, và ESP32 chỉ thấy MQTT rc=-2 dù broker vẫn chạy bình thường.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.202.0/24
