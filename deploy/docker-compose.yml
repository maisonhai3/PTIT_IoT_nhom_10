# Chạy: cd deploy && ./mosquitto/gen-passwd.sh && cp ../backend/.env.example ../backend/.env && docker compose up -d --build
# Mosquitto: broker MQTT trong LAN. backend: API + giao diện web (http://<IP máy>:8080).
services:
  mosquitto:
    # Ghim đúng phiên bản đã kiểm chứng. Thẻ "2" hiện trỏ tới Mosquitto 2.1.x, bản chưa được thử với cấu hình này
    # (từ 2.0.16 broker đã cảnh báo sẽ từ chối file mật khẩu/ACL không đúng chủ sở hữu hoặc quyền). Nâng cấp là một việc có chủ ý.
    image: eclipse-mosquitto:2.0.18
    container_name: awning-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      # Tạo bằng ./mosquitto/gen-passwd.sh (đã .gitignore)
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: awning-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    # Bí mật và cấu hình (MQTT_USER, MQTT_PASSWORD khớp gen-passwd.sh, toạ độ, API_TOKEN...) nằm trong backend/.env
    env_file:
      - ../backend/.env
    environment:
      # Trong mạng của compose, broker có tên dịch vụ là "mosquitto" (ghi đè giá trị trong .env)
      MQTT_URL: tcp://mosquitto:1883
      DB_PATH: /data/awning.db
      STATIC_DIR: /app/frontend
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

volumes:
  mosquitto-data:
  backend-data:
