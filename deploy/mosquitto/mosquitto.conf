# Broker local cho LAN nội bộ: không TLS. KHÔNG đưa cổng 1883 ra Internet.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Giữ retained message (telemetry, weather, status) qua lần restart broker
persistence true
persistence_location /mosquitto/data/
